# Imported from: dotnet runtime 1-1791858064252.json
# Scope variables are supplied by Explorer; fixed matchers and panel settings are preserved.
apiVersion: 1
category:
  id: dotnet-memory
  title: .NET · Memory
  description: dashboard to show metrics who use DotNet open telemetry collector
  order: 20
charts:
- id: panel-90
  title: Memory type proportion
  description: Memory type proportion — imported from dotnet runtime 1, panel 90.
  order: 0
  language: promql
  match:
    modes:
    - byPod
    metricNames:
    - process_num_threads
    - process_working_set_bytes
    - system_runtime_gen_0_size
    - system_runtime_gen_1_size
    - system_runtime_gen_2_size
    - system_runtime_loh_size
    - system_runtime_poh_size
  queries:
  - refId: A
    expr: |
      sum({{selector:system_runtime_gen_0_size}})
    legend: gen_0 (Small Object Heap)
    instant: true
  - refId: B
    expr: |
      sum({{selector:system_runtime_gen_1_size}})
    legend: gen_1 (Small Object Heap)
    instant: true
  - refId: C
    expr: |
      sum({{selector:system_runtime_gen_2_size}})
    legend: gen_2 (Small Object Heap)
    instant: true
  - refId: D
    expr: |
      sum({{selector:system_runtime_loh_size}})
    legend: Large Object Heap
    instant: true
  - refId: E
    expr: |
      sum({{selector:system_runtime_poh_size}})
    legend: Pinned Object Heap
    instant: true
  - refId: F
    expr: |
      sum({{selector:process_working_set_bytes}}) - sum({{selector:system_runtime_poh_size}}) - sum({{selector:system_runtime_loh_size}}) - sum({{selector:system_runtime_gen_0_size}}) - sum({{selector:system_runtime_gen_1_size}}) - sum({{selector:system_runtime_gen_2_size}})- sum({{selector:process_num_threads}})*1024*1024
    legend: Other
    instant: true
  - refId: G
    expr: |
      sum({{selector:process_num_threads}})*1024*1024
    legend: thread stack size
    instant: true
  visualization:
    type: piechart
    width: 12
    height: 288
    options:
      displayLabels:
      - name
      - value
      legend:
        displayMode: table
        placement: right
        showLegend: true
        values:
        - percent
        - value
      pieType: donut
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      sort: desc
      tooltip:
        hideZeros: false
        mode: multi
        sort: asc
    fieldConfig:
      defaults:
        unit: bytes
        color:
          mode: palette-classic
          fixedColor: '#73BF69'
        custom:
          hideFrom:
            legend: false
            tooltip: false
            viz: false
      overrides: []
- id: panel-60
