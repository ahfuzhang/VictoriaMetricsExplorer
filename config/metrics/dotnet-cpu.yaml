charts:
- id: panel-96
  title: process_cpu_seconds_total / s
  description: process_cpu_seconds_total / s — imported from dotnet runtime 1, panel 96.
  order: 0
  language: promql
  match:
    modes:
    - byPod
    metricNames:
    - kube_pod_container_resource_limits
    - process_cpu_seconds_total
  rateWindow: 1m
  selectors:
    kube_pod_container_resource_limits_filtered:
      metricName: kube_pod_container_resource_limits
      matchers:
      - label: resource
        op: '='
        value: cpu
  queries:
  - refId: A
    expr: |
      (sum by ()(rate({{selector:process_cpu_seconds_total}}[{{rateWindow}}])))
    legend: process_cpu_seconds_total
  - refId: B
    expr: |
      sum({{selector:kube_pod_container_resource_limits_filtered}})
    legend: CPU Count
  visualization:
    type: timeseries
    width: 12
    height: 256
    options:
      legend:
        calcs: []
        displayMode: list
        placement: bottom
        showLegend: true
      tooltip:
        hideZeros: false
        mode: single
        sort: none
    fieldConfig:
      defaults:
        unit: percentunit
        thresholds:
          mode: absolute
          steps:
          - value: 0
            color: green
          - value: 80
            color: red
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisCenteredZero: false
          axisColorMode: text
          axisLabel: ''
          axisPlacement: auto
          barAlignment: 0
          barWidthFactor: 0.6
          drawStyle: line
          fillOpacity: 0
          gradientMode: none
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineInterpolation: linear
          lineWidth: 1
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: auto
          showValues: false
          spanNulls: false
          stacking:
            group: A
            mode: none
          thresholdsStyle:
            mode: 'off'
      overrides:
      - matcher:
          id: byFrameRefID
          options: B
        properties:
        - id: custom.axisPlacement
          value: right
        - id: unit
          value: none
        - id: custom.lineWidth
          value: 0
        - id: custom.pointSize
          value: 3
