- id: panel-70
  title: gc_count_total(times/min)
  description: gc_count_total(times/min) — imported from dotnet runtime 1, panel 70.
  order: 0
  language: promql
  match:
    modes:
    - byPod
    metricNames:
    - system_runtime_gen_0_gc_count_total
    - system_runtime_gen_1_gc_count_total
    - system_runtime_gen_2_gc_count_total
  rateWindow: 1m
  queries:
  - refId: A
    expr: |
      sum(increase({{selector:system_runtime_gen_0_gc_count_total}}[{{rateWindow}}]))
    legend: gen_0_gc_count/min
  - refId: B
    expr: |
      sum(increase({{selector:system_runtime_gen_1_gc_count_total}}[{{rateWindow}}]))
    legend: gen_1_gc_count/min
  - refId: C
