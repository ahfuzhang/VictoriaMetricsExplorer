- id: panel-67
  title: system_runtime_time_in_gc (< 5% is health)
  description: |-
    应用程序启动以来，托管线程花费在 GC（垃圾回收）上的总时间占比。
    这个指标累积统计了 线程在 GC 上花的时间 / 总运行时间。
  order: 20
  language: promql
  match:
    modes:
    - byPod
    metricNames:
    - system_runtime_time_in_gc
  queries:
  - refId: A
    expr: |
      avg({{selector:system_runtime_time_in_gc}})
    legend: avg
