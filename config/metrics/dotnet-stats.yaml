- id: panel-29
  title: process_start_time
  description: process_start_time_seconds is a unix timestamp of process start.
  order: 0
  language: promql
  match:
    modes:
    - byPod
    metricNames:
    - process_start_time_seconds
  queries:
  - refId: A
    expr: |
      time()-min({{selector:process_start_time_seconds}})
    instant: true
  visualization:
    type: stat
    width: 6
    height: 128
    options:
      colorMode: value
      graphMode: area
      justifyMode: auto
      orientation: auto
      percentChangeColorMode: standard
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      showPercentChange: false
      textMode: auto
      wideLayout: true
    fieldConfig:
      defaults:
        unit: s
        thresholds:
          mode: absolute
