syntax = "proto3";

package explorer;

option go_package = "github.com/ahfuzhang/victoriametricsexplorer/pkg/proto/explorer;explorerpb";

import "explorer/explorer.proto";

// Messages of the backend's local cache (pkg/cache). Backend only: no TypeScript is generated.

// CacheValue is how every value is stored in the local cache: the protobuf of the cached message
// (a wire response or one of the entries below) and when it was written. The cache (fastcache)
// has no expiry of its own, so readers compare written_at_ms with their TTL.
message CacheValue {
  int64 written_at_ms = 1;  // unix milliseconds of the write
  bool zstd = 2;            // payload is zstd-compressed, which it is when longer than 256 bytes
  bytes payload = 3;
}

// PodGroupsCacheEntry is the pod label's values for one day-aligned range, grouped by workload.
message PodGroupsCacheEntry {
  string label = 1;
  repeated PodGroup groups = 2;
  bool partial = 3;
}

// NodeGroupsCacheEntry is the node label's values for one day-aligned range.
message NodeGroupsCacheEntry {
  string label = 1;
  repeated string nodes = 2;
  bool partial = 3;
}

// MetricTypeCacheEntry is the inferred type of one metric.
message MetricTypeCacheEntry {
  string type = 1;   // counter, gauge, histogram, stat_value
  bool zero = 2;     // every sample in the window is 0
}
