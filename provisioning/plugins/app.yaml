apiVersion: 1

apps:
  - orgId: 1
    type: ahfuzhang-victoriametricsexplorer-app
    enabled: true
    jsonData:
      # Which VictoriaMetrics datasources the Explorer may query. Not set: every datasource of type
      # victoriametrics-metrics-datasource in the organization is available (add yours in Grafana).
      # The Explorer queries them with its own service account, so Grafana's per-user datasource
      # permissions are not enforced by the backend; to bound what Explorer users can reach, list
      # the datasource UIDs here:
      # datasourceUids:
      #   - <datasource-uid>
      # Optional label mappings used for pod/node grouping and a default look-back window.
      podLabel: pod
      namespaceLabel: namespace
      nodeLabel: node
      clusterLabel: cluster
      defaultTimeRange: 1h
      cacheTTL: 2m
      # Capacity of the backend's in-memory cache, shared by all datasources. Memory is allocated as
      # the cache fills. KB/MB/GB are 1024-based; a plain number is bytes; the minimum is 32MB.
      localCacheSize: 1GB
      # Timeout of each request the backend sends to a datasource (through Grafana's datasource
      # proxy). Default 120s. Grafana's own [dataproxy] timeout (default 30s) also applies, so raise
      # that too (GF_DATAPROXY_TIMEOUT) for a longer limit.
      upstreamTimeout: 120s
    # The Explorer reaches datasources with the service account Grafana manages for the plugin, which
    # needs the externalServiceAccounts feature toggle and [auth] managed_service_accounts_enabled and
    # only works in org 1. Without them, give it a token of a service account of this organization with
    # the Viewer role (datasources:read and datasources:query) here or on the app's Configuration page:
    # secureJsonData:
    #   serviceAccountToken: $VMX_SERVICE_ACCOUNT_TOKEN
